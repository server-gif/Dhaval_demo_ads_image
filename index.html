<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images</title>
  <style>
    body { margin: 0; padding: 40px 20px; font-family: system-ui, sans-serif; background: #f5f6f8; }
    .grid { display: grid; gap: 20px; max-width: 900px; margin: auto; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    img { width: 100%; height: 240px; object-fit: contain; display: block; margin-bottom: 12px; }
    a { font-size: 14px; color: #2563eb; word-break: break-all; }
    .uploader-link { display: block; width: fit-content; margin: 0 auto 28px; padding: 11px 16px; color: #fff; background: #5b5bd6; border-radius: 8px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <a class="uploader-link" href="/upload.html">Open two-image uploader</a>
  <div class="grid" id="grid"></div>
  <script>
    // images folder ma je file name chhe te ahiya lakho
    const images = ["ad1.jpg", "ad2.jpg"];

    document.getElementById("grid").innerHTML = images.map(name => {
      const url = `${location.origin}/images/${encodeURIComponent(name)}`;
      return `<div class="card"><img src="${url}" alt="${name}"><a href="${url}" target="_blank">${url}</a></div>`;
    }).join("");
  </script>
</body>
</html>
